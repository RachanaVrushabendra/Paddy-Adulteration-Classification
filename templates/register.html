        <h3 class="text-center lead text-secondary fs-3 text-uppercase fw-bold py-4 px-1 text-white">Paddy Adulteration

        <div class="container m-auto">

            <div class="row g-0 justify-content-center my-5">
                <div class="card col-md-6 col-12 shadow">
                    <div class="card-header text-center h4 lead">
                        SIGN UP
                    </div>
                    <div class="card-body px-4 py-5">
                        <form id="formsignin" method="get" action="">
                            <div class="row justify-content-center">
                                <div class="mb-4 col-md-6">

                                        class="form-control shadow-none border rounded-0 border-start-0 border-end-0 border-top-0 border-2"
                                        id="name" name="name" placeholder="Name">
                                </div>
                                <div class="mb-4 col-md-6">
                                    <input type="text"
                                        class="form-control shadow-none border rounded-0 border-start-0 border-end-0 border-top-0 border-2"
                                        id="phone" name="phone" placeholder="Phone">
                                </div>
                                <div class="mb-4 col-md-6">
                                    <input type="text"
                                        class="form-control shadow-none border rounded-0 border-start-0 border-end-0 border-top-0 border-2"
                                        id="email" name="email" placeholder="Email">
                                </div>
                                <div class="mb-4 col-md-6">
                                    <input type="text"
                                        class="form-control shadow-none border rounded-0 border-start-0 border-end-0 border-top-0 border-2"
                                        id="dob" name="dob" placeholder="Date Of Birth">
                                </div>
                                <div class="mb-4 col-md-6">
                                    <input type="password"
                                        class="form-control shadow-none border rounded-0 border-start-0 border-end-0 border-top-0 border-2"
                                        id="pswd" name="pswd" placeholder="Password">
                                </div>
                                <div class="mb-4 col-md-6">
                                    <input type="password"
                                        class="form-control shadow-none border rounded-0 border-start-0 border-end-0 border-top-0 border-2"
                                        id="confirm_password" name="confirm_password" placeholder="Confirm Password">
                                </div>
                                <div class="w-100"></div>
                                <div class="mb-2 col-md-6">
                                    <textarea
                                        class="form-control shadow-none border rounded-0 border-start-0 border-end-0 border-top-0 border-2"
                                        id="addr" name="addr" placeholder="Address"></textarea>
                                </div>
                                <div class="py-1 mb-3"></div>
                                <!-- <a href="#" id="signin" role="button" type="submit" class="btn btn-lg btn-outline-secondary col-12 mx-auto">Sign In</a> -->

    <script>


        $("#btnsignup").click(function (event) {
            event.preventDefault();
            var uname = document.getElementById('name').value;
            var pswd = document.getElementById('pswd').value;
            var email = document.getElementById('email').value;
            var phone = document.getElementById('phone').value;
            var addr = document.getElementById('addr').value;
            var dob = document.getElementById('dob').value;

            if (uname == "" ||
                pswd == "" || email == "" ||
                phone == "" || addr == "") {

                alert('Please Fill All Fields');
                return false;
            }
            var flag = true;

            var unamer = document.getElementById('name').value;
            var intRegexunamer = /^[A-Za-z ]+$/;
            if (!intRegexunamer.test(unamer)) {
                alert('Please enter a valid name.');
                $('#uname').css('border-color', 'Red');
                flag = false;
                return flag;
            }
            else {
                $('#uname').css('border-color', 'white');
                flag = true;
            }


            var namer = document.getElementById('pswd').value;
            var intRegexnamer = /^[A-Za-z0-9 ]+$/;
            if (!intRegexnamer.test(namer)) {
                alert('Please enter password.');
                $('#pswd').css('border-color', 'Red');
                flag = false;
                return flag;
            }
            else {
                $('#pswd').css('border-color', 'white');
                flag = true;
            }
            var email = document.getElementById('email').value;
            var emailReg = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            if (!emailReg.test(email) || email == '') {
                alert('Please enter a valid email id.');
                $('#email').css('border-color', 'Red');
                flag = false;
                return flag;
            }
            else {
                $('#email').css('border-color', 'white');
                flag = true;
            }


            var phone = document.getElementById('phone').value;
            var intRegex = /^(7|8|9)[0-9]{9}$/;
            if (!intRegex.test(phone)) {
                alert('Please enter a valid phone number.');
                $('#phone').css('border-color', 'Red');
                flag = false;
                return flag;
            }
            else {
                $('#phone').css('border-color', 'white');
                flag = true;
            }

            var addrs = document.getElementById('addr').value;
            if (addrs == '') {
                alert('Please enter address.');
                $('#addr').css('border-color', 'Red');
                flag = false;
                return flag;
            }
            else {
                $('#addr').css('border-color', 'white');
                flag = true;
            }

            //return flag;
            // return flag;
            //}

            //var gender="";
            //if(document.getElementById('gen').checked==true)
            // gender="Male";
            //if(document.getElementById('gen1').checked==true)
            // gender="Female";

            /* window.location='regdata?uname='+uname+'&name='+name+'&pswd='+pswd+'&email='+email+'&phone='+phone+'&addr='+addr;*/

            $.ajax({
                type: 'POST',
                url: '/regdata',

                contentType: 'application/json;charset=UTF-8',
                data: {
                    'uname': uname,
                    'dob': dob,
                    'email': email,
                    'phone': phone,
                    'pswd': pswd,
                    'addr': addr
                },

                // dataType:"json",
                success: function (data) {
                    alert('Data saved Successfully');
                    window.location = 'login';

                },
            });

        });





    </script>
